<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex - Global Entertainment</title>
  <style>
    :root { --bg:#050505; --card-bg:rgba(15,15,15,0.9); --red:#e63946; --gold:#d4af37; --text:#ffffff; --text-muted:#888888; --border:#333333; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',system-ui,-apple-system,sans-serif; background-color:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }
    .container { max-width:480px; margin:0 auto; padding:20px; width:100%; }
    
    /* 顶部导航 */
    .header { display:flex; justify-content:space-between; align-items:center; padding:10px 0 20px 0; }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand .logo-img { width:52px; height:52px; object-fit:contain; }
    .brand-text { display:flex; flex-direction:column; }
    .brand-text .en { 
      font-size:24px; font-weight:900; letter-spacing:4px; 
      background:linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1.1;
    }
    .brand-text .sub { font-size:10px; color:var(--text-muted); letter-spacing:2px; margin-top:4px; }
    .lang-switch { color:var(--text-muted); font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; border:1px solid var(--border); padding:6px 12px; border-radius:20px; transition:0.3s; }
    .lang-switch:hover { border-color:#fff; color:#fff; }
    
    .banner-text { text-align:center; margin-bottom:12px; }
    .banner-text .main-title { font-size:16px; font-weight:bold; color:#fff; letter-spacing:1px; margin-bottom:6px; }
    .banner-text .sub-title { font-size:11px; color:var(--text-muted); letter-spacing:0.5px; }
    .banner { width:100%; height:140px; background:url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?auto=format&fit=crop&w=800&q=80') no-repeat center center/cover; border-radius:12px; border:1px solid var(--border); margin-bottom:24px; position:relative; overflow:hidden; }
    .banner::after { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%); }
    
    /* 登录卡片 */
    .auth-card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:24px 20px; box-shadow:0 10px 30px rgba(0,0,0,0.8); backdrop-filter:blur(12px); margin-bottom:30px; }
    .tabs { display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:24px; }
    .tab { flex:1; padding:14px; text-align:center; cursor:pointer; font-weight:bold; transition:0.3s; color:var(--text-muted); background:transparent; border:none; font-size:16px; }
    .tab.active { background:#fff; color:#000; }
    .input-group { margin-bottom:16px; }
    .input-group label { display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; }
    .input-group input { width:100%; padding:14px; background:#0a0a0a; border:1px solid var(--border); border-radius:8px; color:#fff; font-size:15px; outline:none; transition:0.3s; }
    .input-group input:focus { border-color:#fff; }
    .captcha-row { display:flex; gap:10px; }
    .captcha-row input { flex:1; }
    .captcha-img { width:100px; background:#0a0a0a; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; border-radius:8px; font-family:serif; font-style:italic; color:var(--gold); letter-spacing:2px; font-size:20px; cursor:pointer; }
    .checkbox-group { display:flex; align-items:center; gap:8px; margin:20px 0; font-size:12px; color:var(--text-muted); }
    .checkbox-group input { accent-color:#fff; }
    .checkbox-group a { color:#fff; text-decoration:none; }
    .btn-primary { width:100%; padding:16px; background:#fff; color:#000; font-weight:700; font-size:16px; border:none; border-radius:10px; cursor:pointer; transition:0.3s; letter-spacing:1px; }
    .btn-primary:hover { background:#e0e0e0; transform:translateY(-2px); box-shadow:0 5px 15px rgba(255,255,255,0.1); }
    .divider { text-align:center; position:relative; margin:24px 0; color:var(--text-muted); font-size:12px; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:30%; height:1px; background:var(--border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .social-login { display:flex; justify-content:center; gap:20px; }
    .social-btn { width:44px; height:44px; border-radius:50%; background:#0a0a0a; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; font-size:14px; font-weight:bold; transition:0.3s; }
    .social-btn:hover { border-color:#fff; }
    
    /* 核心优势区（精致图标） */
    .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:20px; padding:0 10px; }
    .feature-card { display:flex; align-items:center; gap:10px; text-align:left; }
    /* 图标底色改为淡淡的金色，图标颜色变为金色 */
    .feature-card .icon { width:36px; height:36px; flex-shrink:0; border-radius:50%; background:rgba(212,175,55,0.1); display:flex; align-items:center; justify-content:center; color:var(--gold); }
    .feature-card .icon svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .feature-card .text-group { display:flex; flex-direction:column; }
    .feature-card .zh { color:#fff; font-size:12px; font-weight:bold; margin-bottom:2px; }
    .feature-card .desc { color:var(--text-muted); font-size:10px; line-height:1.3; }
    
    .footer { text-align:center; color:var(--text-muted); font-size:12px; margin-top:30px; padding-bottom:20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="./logo.jpeg" alt="Apex Logo" class="logo-img">
        <div class="brand-text">
          <span class="en">APEX</span>
          <span class="sub">全球娱乐游戏平台</span>
        </div>
      </div>
      <div class="lang-switch">🌐 EN / 中文</div>
    </div>
    
    <div class="banner-text">
      <div class="main-title">全球游戏娱乐平台</div>
      <div class="sub-title">一站式体验·玩法丰富·公平公正·极速存取</div>
    </div>
    
    <div class="banner"></div>
    
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active">登录</button>
        <button class="tab">注册</button>
      </div>
      <div class="input-group">
        <label>邮箱 / 手机号</label>
        <input type="text" placeholder="请输入邮箱或手机号">
      </div>
      <div class="input-group">
        <label>登录密码</label>
        <input type="password" placeholder="请输入密码">
      </div>
      <div class="input-group">
        <label>验证码</label>
        <div class="captcha-row">
          <input type="text" placeholder="图形验证码">
          <div class="captcha-img">A7KD</div>
        </div>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="agreement" checked>
        <label for="agreement">我已阅读并同意 <a href="#">《用户协议》</a> 与 <a href="#">《隐私政策》</a></label>
      </div>
      <button class="btn-primary">登 录</button>
      <div class="divider">或使用第三方账号登录</div>
      <div class="social-login">
        <div class="social-btn">G</div>
        <div class="social-btn">T</div>
        <div class="social-btn">A</div>
      </div>
    </div>
    
    <!-- 核心优势区（最新 SVG 图标） -->
    <div class="features-grid">
      <div class="feature-card">
        <div class="icon">
          <!-- 1. 安全可靠：盾牌 + 对勾，更精致 -->
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div class="text-group">
          <div class="zh">安全可靠</div>
          <div class="desc">顶级加密 资金保障</div>
        </div>
      </div>
      <div class="feature-card">
        <div class="icon">
          <!-- 2. 公平公正：天平图标，线条更清晰 -->
          <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 7l7-4 7 4"/><path d="M5 14h4c0 2-2 4-4 4s-4-2-4-4z"/><path d="M15 14h4c0 2-2 4-4 4s-4-2-4-4z"/></svg>
        </div>
        <div class="text-group">
          <div class="zh">公平公正</div>
          <div class="desc">全球监管 透明公开</div>
        </div>
      </div>
      <div class="feature-card">
        <div class="icon">
          <!-- 3. 极速开户：闪电图标，更锋利 -->
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="text-group">
          <div class="zh">极速开户</div>
          <div class="desc">简单便捷 快速畅玩</div>
        </div>
      </div>
      <div class="feature-card">
        <div class="icon">
          <!-- 4. 24/7客服：带麦克风的耳机，更具服务感 -->
          <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        </div>
        <div class="text-group">
          <div class="zh">24/7客服</div>
          <div class="desc">专业团队 随时在线</div>
        </div>
      </div>
    </div>
    
    <div class="footer">© 2026 Apex Global Entertainment. All rights reserved.</div>
  </div>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
