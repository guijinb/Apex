name: Daily Database Backup

on:
  schedule:
    # 每天凌晨 3 点（UTC）执行，对应北京时间 11 点
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1
        continue-on-error: true

      - name: Checkout main branch code
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/
          git checkout origin/main -- wrangler.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups
          DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backups/apex-db-${DATE}.sql"
          wrangler d1 export apex-db --remote --output="${BACKUP_FILE}" --no-schema
          gzip "${BACKUP_FILE}"
          sha256sum "${BACKUP_FILE}.gz" > "${BACKUP_FILE}.gz.sha256"
          echo "Backup created: ${BACKUP_FILE}.gz"
          ls -lh backups/

      - name: Commit to backups branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "chore: daily backup $(date +%Y-%m-%d)" || echo "No changes"
          git push origin HEAD:backups || echo "Push failed, retrying..."
          git push origin HEAD:backups
        continue-on-error: true

      - name: Cleanup old backups (keep 30 days)
        run: |
          find backups/ -name "*.sql.gz" -mtime +30 -delete
          find backups/ -name "*.sha256" -mtime +30 -delete
