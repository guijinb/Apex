name: CI - Test & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Security Scan
        run: node tests/security-scan.js

      - name: Wait for deployment
        run: sleep 45

      # BASE_URL 通过仓库变量 DEPLOY_BASE_URL 配置，避免硬编码域名
      - name: API Smoke Test
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "[SKIP] DEPLOY_BASE_URL 未配置，跳过 API 冒烟测试"
            exit 0
          fi
          node tests/api-smoke.test.js
        continue-on-error: false
